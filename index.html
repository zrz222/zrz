<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TXT播书阅读器｜网页版</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{max-width:720px;margin:16px auto;padding:0 12px;font-size:18px;line-height:1.8;}
        .warn-box{background:#fff2cc;border:1px solid #ffc107;padding:10px;border-radius:8px;margin-bottom:12px;color:#945c00;}
        .btn-wrap{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
        button{font-size:17px;padding:12px 14px;min-height:48px;border-radius:8px;border:1px solid #777;background:#f7f7f7;}
        button:active{background:#dddddd;}
        .speed-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;}
        input[type="range"]{flex:1;height:30px;}
        #progressBar{width:100%;height:24px;margin:10px 0;}
        #textBox{margin-top:14px;padding:14px;min-height:420px;white-space:pre-wrap;border:1px solid #bbbbbb;border-radius:8px;font-size:17px;line-height:1.9;}
        #status{margin:8px 0 4px;}
    </style>
</head>
<body>
    <div id="warnBox" class="warn-box" style="display:none;">⚠️当前浏览器不支持语音朗读，请使用【安卓Edge浏览器】打开本页面，文字阅读不受影响</div>

    <div><input type="file" id="fileInput" accept=".txt"></div>
    <div class="btn-wrap">
        <button id="playBtn">播放 / 暂停</button>
        <button id="prevBtn">上一页</button>
        <button id="nextBtn">下一页</button>
    </div>
    <div class="speed-row">
        <label>语速</label>
        <input type="range" id="speedSlider" min="0.4" max="2.2" step="0.1" value="1">
        <button id="resetSpeed">重置1倍</button>
    </div>
    <input type="range" id="progressBar" min="0" max="100" value="0">
    <div id="status">请选择Z‑Library下载的TXT文件</div>
    <div id="textBox">请选择TXT小说</div>

<script>
let KokoroTTS = null;
let kokoroReady = false;
let ttsEngine = null;
let audioCtx = null;
const MODEL_URL_LIST = [
    "https://hf‑mirror.com/hexgrad/Kokoro‑82M‑v1.1‑zh/resolve/main/kokoro‑v1.1‑zh‑q8.onnx",
    "https://mirror.ghproxy.com/https://huggingface.co/hexgrad/Kokoro‑82M‑v1.1‑zh/resolve/main/kokoro‑v1.1‑zh‑q8.onnx"
];
const VOICE_ID = "zf_xiaobei";
const MAX_SENTENCE_LEN = 180;
const pageSize = 800;

document.addEventListener('DOMContentLoaded',()=>{
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const speedSlider = document.getElementById('speedSlider');
    const resetSpeed = document.getElementById('resetSpeed');
    const progressBar = document.getElementById('progressBar');
    const statusDom = document.getElementById('status');
    const textBox = document.getElementById('textBox');
    const warnBox = document.getElementById('warnBox');

    if(!window.speechSynthesis){
        warnBox.style.display="block";
        playBtn.disabled=true;
        playBtn.innerText="浏览器不支持朗读";
    }

    let bookText = "";
    let playPos = 0;
    let viewPos = 0;
    let currentFileName = "";
    let speechRate = 1.0;
    let isPlaying = false;

    function setStatus(s){ statusDom.innerText = s; }

    //后台加载Kokoro，设置30秒超时，失败不卡死主程序
    (async function loadKokoroSafe(){
        try{
            const importPromise = import("https://cdn.jsdelivr.net/npm/kokoro‑wasm‑zh@1.1.2/dist/kokoro‑wasm‑zh.js");
            const timeout = new Promise((_,rej)=>setTimeout(()=>rej("加载超时"),30000));
            const mod = await Promise.race([importPromise,timeout]);
            KokoroTTS = mod.KokoroTTS;
        }catch(e){
            setStatus("Kokoro库加载超时，一直使用系统语音");
            return;
        }
        for(let i=0;i<MODEL_URL_LIST.length;i++){
            try{
                setStatus(`后台下载离线模型 ${i+1}/${MODEL_URL_LIST.length}，当前使用系统语音`);
                ttsEngine = await KokoroTTS.create({
                    modelUrl:MODEL_URL_LIST[i],
                    cacheModel:true,
                    timeout:22000
                });
                audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                kokoroReady = true;
                setStatus("✅离线Kokoro女声就绪，自动切换语音");
                return;
            }catch(err){
                console.log("源失败切换下一个",err);
            }
        }
        setStatus("全部镜像下载失败，使用浏览器系统语音");
    })();

    function renderView(){
        const slice = bookText.slice(viewPos, viewPos + pageSize);
        textBox.innerText = slice;
        const pct = bookText.length>0 ? Math.floor(playPos / bookText.length * 100) : 0;
        progressBar.value = pct;
        if(currentFileName && bookText.length>0){
            localStorage.setItem("book_pos_"+currentFileName, String(playPos));
        }
    }

    fileInput.onchange = async e=>{
        const f = e.target.files[0];
        if(!f) return;
        setStatus("读取TXT文件...");
        currentFileName = f.name;
        const buf = await f.arrayBuffer();

        const contentUtf8 = new TextDecoder("utf-8").decode(buf);
        const contentGb18030 = new TextDecoder("gb18030").decode(buf);

        const badUtf8 = (contentUtf8.match(/�/g) || []).length;
        const badGb18030 = (contentGb18030.match(/�/g) || []).length;

        if(badUtf8 <= badGb18030){
            bookText = contentUtf8;
            setStatus(`编码：UTF‑8，乱码符号：${badUtf8}`);
        }else{
            bookText = contentGb18030;
            setStatus(`编码：GB18030(Z‑Library)，乱码符号：${badGb18030}`);
        }

        const saved = localStorage.getItem("book_pos_"+currentFileName);
        if(saved !== null){
            const savedPos = parseInt(saved,10);
            if(!isNaN(savedPos) && savedPos < bookText.length){
                playPos = savedPos;
                viewPos = savedPos;
                setStatus(statusDom.innerText + "｜恢复上次播放位置");
            }else{
                playPos = 0; viewPos = 0;
            }
        }else{
            playPos = 0; viewPos = 0;
        }
        renderView();
    }

    function stopRead(){
        isPlaying = false;
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        setStatus("已暂停");
    }

    function getNextSentence(){
        if(playPos >= bookText.length) return null;
        const endSearch = Math.min(playPos + MAX_SENTENCE_LEN, bookText.length);
        const sliceStr = bookText.slice(playPos, endSearch);
        let splitPoint = -1;
        for(let i = sliceStr.length‑1;i>=0;i--){
            if(/[。！？；]/.test(sliceStr[i])){
                splitPoint = i+1;break;
            }
        }
        if(splitPoint <= 0) splitPoint = sliceStr.length;
        const segText = sliceStr.substring(0,splitPoint).replace(/\s+$/,'');
        return {text:segText, endPos:playPos+splitPoint};
    }

    async function playKokoroAudio(pcmData){
        const buf = audioCtx.createBuffer(1,pcmData.length,24000);
        buf.copyToChannel(pcmData,0);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start();
        await new Promise(res=>src.onended = res);
    }

    async function speakNextChunk(){
        if(!isPlaying) return;
        const seg = getNextSentence();
        if(!seg || !seg.text){
            stopRead();
            setStatus("全书朗读结束");
            return;
        }
        if(kokoroReady && ttsEngine && audioCtx){
            setStatus("Kokoro离线女声朗读中");
            const pcm = await ttsEngine.generate(seg.text,{voice:VOICE_ID,speed:speechRate});
            await playKokoroAudio(pcm);
        }else{
            setStatus("浏览器系统语音（模型下载中）");
            const utter = new SpeechSynthesisUtterance(seg.text);
            utter.rate = speechRate;
            await new Promise(res=>{
                utter.onend = res;
                window.speechSynthesis.speak(utter);
            });
        }
        playPos = seg.endPos;
        renderView();
        if(isPlaying){
            setTimeout(speakNextChunk,20);
        }
    }

    playBtn.onclick = async ()=>{
        if(!bookText){
            setStatus("请先选择TXT文件");
            return;
        }
        if(!window.speechSynthesis){
            setStatus("❌浏览器不支持TTS，请使用Edge");
            return;
        }
        if(isPlaying){
            stopRead();
        }else{
            isPlaying = true;
            speakNextChunk();
        }
    }

    prevBtn.onclick = ()=>{
        viewPos = Math.max(0, viewPos - pageSize);
        renderView();
    }
    nextBtn.onclick = ()=>{
        viewPos += pageSize;
        renderView();
    }

    speedSlider.oninput = ()=>{
        speechRate = Number(speedSlider.value);
    }

    resetSpeed.onclick = ()=>{
        speechRate = 1.0;
        speedSlider.value = 1.0;
        setStatus("语速已重置1.0倍");
    }

    progressBar.oninput = ()=>{
        stopRead();
        const val = Number(progressBar.value);
        const targetPos = Math.floor(val / 100 * bookText.length);
        playPos = targetPos;
        viewPos = targetPos;
        renderView();
    }
})
</script>
</body>
</html>
