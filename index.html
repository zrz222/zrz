<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TXT播书阅读器｜网页版</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{max-width:720px;margin:16px auto;padding:0 12px;font-size:18px;line-height:1.8;}
        .warn-box{background:#fff2cc;border:1px solid #ffc107;padding:10px;border-radius:8px;margin-bottom:12px;color:#945c00;}
        .btn-wrap{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
        button{font-size:17px;padding:12px 14px;min-height:48px;border-radius:8px;border:1px solid #777;background:#f7f7f7;}
        button:active{background:#dddddd;}
        .speed-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;}
        input[type="range"]{flex:1;height:30px;}
        #progressBar{width:100%;height:24px;margin:10px 0;}
        #textBox{margin-top:14px;padding:14px;min-height:420px;white-space:pre-wrap;border:1px solid #bbbbbb;border-radius:8px;font-size:17px;line-height:1.9;}
        #status{margin:8px 0 4px;}
    </style>
</head>
<body>
    <div id="warnBox" class="warn-box" style="display:none;">⚠️当前浏览器不支持语音朗读，请使用【安卓Edge浏览器】打开本页面，文字阅读不受影响</div>

    <div><input type="file" id="fileInput" accept=".txt"></div>
    <div class="btn-wrap">
        <button id="playBtn">播放 / 暂停</button>
        <button id="prevBtn">上一页</button>
        <button id="nextBtn">下一页</button>
    </div>
    <div class="speed-row">
        <label>语速</label>
        <input type="range" id="speedSlider" min="0.4" max="2.2" step="0.1" value="1">
        <button id="resetSpeed">重置1倍</button>
    </div>
    <input type="range" id="progressBar" min="0" max="100" value="0">
    <div id="status">请选择Z‑Library下载的TXT文件</div>
    <div id="textBox">请选择TXT小说</div>

<script>
// Kokoro全局变量（后台加载，失败完全不干扰原版阅读器运行）
let kokoroReady = false;
let kokoroInstance = null;
let audioCtx = null;
const VOICE_NAME = "zf_xiaobei";
const MAX_SENT_LEN = 180;
//多镜像模型地址
const modelSourceList = [
    "https://hf-mirror.com/hexgrad/Kokoro-82M-v1.1-zh/resolve/main/kokoro-v1.1-zh-q8.onnx",
    "https://mirror.ghproxy.com/https://huggingface.co/hexgrad/Kokoro-82M-v1.1-zh/resolve/main/kokoro-v1.1-zh-q8.onnx"
];

//后台异步加载Kokoro，设置超时保护，绝对不阻塞页面与TXT读取
(async function initKokoroBackground(){
    try{
        //动态导入库，30秒超时
        const loadTask = import("https://cdn.jsdelivr.net/npm/kokoro-wasm-zh@1.1.2/dist/kokoro-wasm-zh.js");
        const timeOutTask = new Promise((_, reject)=>setTimeout(()=>reject("超时"),30000));
        const lib = await Promise.race([loadTask, timeOutTask]);

        //依次尝试镜像下载模型
        for(let url of modelSourceList){
            try{
                kokoroInstance = await lib.KokoroTTS.create({
                    modelUrl:url,
                    cacheModel:true,
                    timeout:22000
                });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                kokoroReady = true;
                setStatus("✅Kokoro离线语音就绪");
                return;
            }catch(e){
                console.log("当前源失败，切换镜像",e);
            }
        }
        setStatus("离线模型全部下载失败，使用系统语音");
    }catch(err){
        console.log("Kokoro加载失败",err);
    }
})();

document.addEventListener('DOMContentLoaded',()=>{
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const speedSlider = document.getElementById('speedSlider');
    const resetSpeed = document.getElementById('resetSpeed');
    const progressBar = document.getElementById('progressBar');
    const statusDom = document.getElementById('status');
    const textBox = document.getElementById('textBox');
    const warnBox = document.getElementById('warnBox');

    if(!window.speechSynthesis){
        warnBox.style.display="block";
        playBtn.disabled=true;
        playBtn.innerText="浏览器不支持朗读";
    }

    let bookText = "";
    let playPos = 0;
    let viewPos = 0;
    let currentFileName = "";
    const chunkSize = 800;
    const pageSize = 800;
    let speechRate = 1.0;
    let isPlaying = false;

    function setStatus(s){ statusDom.innerText = s; }

    function renderView(){
        const slice = bookText.slice(viewPos, viewPos + pageSize);
        textBox.innerText = slice;
        const pct = bookText.length>0 ? Math.floor(playPos / bookText.length * 100) : 0;
        progressBar.value = pct;
        if(currentFileName && bookText.length>0){
            localStorage.setItem("book_pos_"+currentFileName, String(playPos));
        }
    }

    fileInput.onchange = async e=>{
        const f = e.target.files[0];
        if(!f) return;
        setStatus("读取TXT文件...");
        currentFileName = f.name;
        const buf = await f.arrayBuffer();

        const contentUtf8 = new TextDecoder("utf-8").decode(buf);
        const contentGb18030 = new TextDecoder("gb18030").decode(buf);

        const badUtf8 = (contentUtf8.match(/�/g) || []).length;
        const badGb18030 = (contentGb18030.match(/�/g) || []).length;

        if(badUtf8 <= badGb18030){
            bookText = contentUtf8;
            setStatus(`编码：UTF‑8，乱码符号：${badUtf8}`);
        }else{
            bookText = contentGb18030;
            setStatus(`编码：GB18030(Z‑Library)，乱码符号：${badGb18030}`);
        }

        const saved = localStorage.getItem("book_pos_"+currentFileName);
        if(saved !== null){
            const savedPos = parseInt(saved,10);
            if(!isNaN(savedPos) && savedPos < bookText.length){
                playPos = savedPos;
                viewPos = savedPos;
                setStatus(statusDom.innerText + "｜恢复上次播放位置");
            }else{
                playPos = 0; viewPos = 0;
            }
        }else{
            playPos = 0; viewPos = 0;
        }
        renderView();
    }

    function stopRead(){
        isPlaying = false;
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        setStatus("已暂停");
    }

    //智能分句函数（Kokoro专用）
    function getSentence(){
        if(playPos >= bookText.length) return null;
        const endLimit = Math.min(playPos + MAX_SENT_LEN, bookText.length);
        const segStr = bookText.slice(playPos, endLimit);
        let cutIndex = -1;
        for(let i=segStr.length-1;i>=0;i--){
            if(/[。！？；]/.test(segStr[i])){
                cutIndex = i+1;
                break;
            }
        }
        if(cutIndex <= 0) cutIndex = segStr.length;
        const textOut = segStr.slice(0,cutIndex).replace(/\s+$/,"");
        return {text:textOut,end:playPos+cutIndex};
    }

    //播放Kokoro音频
    async function playKokoroPcm(pcmBuffer){
        const audioBuf = audioCtx.createBuffer(1,pcmBuffer.length,24000);
        audioBuf.copyToChannel(pcmBuffer,0);
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuf;
        source.connect(audioCtx.destination);
        source.start();
        await new Promise(res=>source.onended=res);
    }

    async function speakNextChunk(){
        if(!isPlaying) return;

        //✅离线语音就绪 → 使用Kokoro，否则原版系统TTS逻辑不变
        if(kokoroReady && kokoroInstance && audioCtx){
            const segInfo = getSentence();
            if(!segInfo || !segInfo.text){
                stopRead();
                setStatus("全书朗读结束");
                return;
            }
            setStatus("Kokoro离线女声朗读中");
            const pcmData = await kokoroInstance.generate(segInfo.text,{
                voice:VOICE_NAME,
                speed:speechRate
            });
            await playKokoroPcm(pcmData);
            playPos = segInfo.end;
        }else{
            //完全保留你原来整套原版系统朗读代码，一点不动
            let chunkText = bookText.slice(playPos, playPos + chunkSize);
            if(!chunkText){
                stopRead();
                setStatus("全书朗读结束");
                return;
            }
            chunkText = chunkText.replace(/\s+$/,'');
            const endPos = playPos + chunkSize;
            setStatus("正在朗读（系统语音，模型下载中）");
            const utter = new SpeechSynthesisUtterance(chunkText);
            utter.rate = speechRate;
            utter.onend = function(){
                playPos = endPos;
                renderView();
                setTimeout(()=>{
                    if(isPlaying){
                        window.speechSynthesis.cancel();
                        speakNextChunk();
                    }
                },15);
            };
            utter.onerror = function(){
                playPos = endPos;
                renderView();
                setTimeout(()=>{
                    if(isPlaying) speakNextChunk();
                },30);
            };
            window.speechSynthesis.speak(utter);
            return;
        }

        renderView();
        if(isPlaying){
            setTimeout(speakNextChunk,20);
        }
    }

    playBtn.onclick = ()=>{
        if(!bookText){
            setStatus("请先选择TXT文件");
            return;
        }
        if(!window.speechSynthesis){
            setStatus("❌浏览器不支持TTS，请使用Edge");
            return;
        }
        if(isPlaying){
            stopRead();
        }else{
            isPlaying = true;
            speakNextChunk();
        }
    }

    prevBtn.onclick = ()=>{
        viewPos = Math.max(0, viewPos - pageSize);
        renderView();
    }
    nextBtn.onclick = ()=>{
        viewPos += pageSize;
        renderView();
    }

    speedSlider.oninput = ()=>{
        speechRate = Number(speedSlider.value);
        if(isPlaying){
            stopRead();
            isPlaying=true;
            speakNextChunk();
        }
    }

    resetSpeed.onclick = ()=>{
        speechRate = 1.0;
        speedSlider.value = 1.0;
        if(isPlaying){
            stopRead();
            isPlaying=true;
            speakNextChunk();
        }
        setStatus("语速已重置1.0倍");
    }

    progressBar.oninput = ()=>{
        stopRead();
        const val = Number(progressBar.value);
        const targetPos = Math.floor(val / 100 * bookText.length);
        playPos = targetPos;
        viewPos = targetPos;
        renderView();
    }
})
</script>
</body>
</html>
