<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TXT播书阅读器｜网页版</title>
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        window.ttsPipeline = pipeline;
    </script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        html,body{min-height:100%;}
        body{max-width:720px;margin:16px auto;padding:0 12px;font-size:18px;line-height:1.8;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans SC,sans-serif;color:#222;}
        .warn-box{background:#fff2cc;border:1px solid #ffc107;padding:10px;border-radius:8px;margin-bottom:12px;color:#945c00;}
        .btn-wrap{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
        .set-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;}
        button{font-size:15px;padding:11px 10px;min-height:46px;border-radius:8px;border:1px solid #777;background:#f7f7f7;white-space:nowrap;}
        button:active{background:#dddddd;}
        select{padding:10px;min-height:44px;border-radius:6px;font-size:15px;}
        .speed-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;}
        input[type="range"]{flex:1;height:30px;}
        #progressBar{width:100%;height:24px;margin:10px 0;}
        #textBox{margin-top:14px;padding:14px;min-height:420px;white-space:pre-wrap;word-break:break-all;border:1px solid #bbbbbb;border-radius:8px;font-size:17px;line-height:1.9;background:#fff;color:#111;overflow:auto;}
        #status{margin:8px 0 4px;min-height:24px;}
        .tip-small{font-size:13px;color:#606060;margin:6px 0 12px;}
        .hidden-input{display:none;}
    </style>
</head>
<body>
    <div id="warnBox" class="warn-box" style="display:none;">⚠️当前浏览器不支持语音朗读，请使用【安卓Edge浏览器】打开本页面，文字阅读不受影响</div>

    <div><input type="file" id="fileInput" accept=".txt"></div>

    <!--新增模型源切换区域-->
    <div class="set-row">
        <span>模型下载源：</span>
        <select id="modelSourceSel">
            <option value="Xenova/kokoro-82m">默认源 Xenova/kokoro‑82m</option>
            <option value="hf-mirror.com/Xenova/kokoro-82m">国内镜像源 hf‑mirror</option>
        </select>
        <button id="reloadModelBtn">切换后重载模型</button>
    </div>

    <div class="btn-wrap">
        <button id="playBtn">播放 / 暂停</button>
        <button id="prevBtn">上一页</button>
        <button id="nextBtn">下一页</button>
        <button id="dlModelBtn">跳转下载onnx模型</button>
        <button id="uploadBtn">上传本地模型文件</button>
        <input id="modelUploadInput" class="hidden-input" type="file" accept=".onnx">
    </div>
    <div class="tip-small">提示：仅‑q8.onnx量化版可用，pth原版模型无法加载；不上传文件则联网自动下载缓存</div>
    <div class="speed-row">
        <label>语速</label>
        <input type="range" id="speedSlider" min="0.4" max="2.2" step="0.1" value="1">
        <button id="resetSpeed">重置1倍</button>
    </div>
    <input type="range" id="progressBar" min="0" max="100" value="0">
    <div id="status">请选择Z‑Library下载的TXT文件</div>
    <div id="textBox">请选择TXT小说</div>

<script>
let kokoroReady = false;
let ttsEngine = null;
let audioCtx = null;
const MAX_SENT_LEN = 180;
//模型下载跳转地址（Xenova转换好的onnx仓库，不是pth仓库）
const MODEL_REPO_URL = "https://hf-mirror.com/Xenova/kokoro-82m";

//下拉选中的当前源
let currentModelSource = "Xenova/kokoro-82m";

function setStatus(s){
    const statusDom = document.getElementById("status");
    if(statusDom) statusDom.innerText = s;
}

async function loadOnlineModelAutoSwitch(){
    const pipeline = await window.ttsPipeline;
    try{
        setStatus(`正在加载：${currentModelSource}`);
        ttsEngine = await pipeline("text-to-speech",currentModelSource,{quantized:true});
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        kokoroReady = true;
        setStatus("✅在线模型加载完成，离线语音就绪");
        return true;
    }catch(err){
        console.log("源加载失败：",currentModelSource,err);
        setStatus("❌当前源加载失败，请切换镜像源后点重载");
        kokoroReady = false;
        return false;
    }
}

async function loadLocalModel(file){
    try{
        setStatus("正在读取上传模型文件…");
        const pipeline = await window.ttsPipeline;
        ttsEngine = await pipeline("text-to-speech",file,{quantized:true});
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        kokoroReady = true;
        setStatus("✅本地上传模型加载成功");
    }catch(err){
        setStatus("❌上传模型加载失败，请确认是‑q8.onnx文件");
        console.log(err);
    }
}

//页面启动预加载
loadOnlineModelAutoSwitch();

document.addEventListener('DOMContentLoaded',()=>{
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dlModelBtn = document.getElementById('dlModelBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const modelUploadInput = document.getElementById('modelUploadInput');
    const speedSlider = document.getElementById('speedSlider');
    const resetSpeed = document.getElementById('resetSpeed');
    const progressBar = document.getElementById('progressBar');
    const statusDom = document.getElementById('status');
    const textBox = document.getElementById('textBox');
    const warnBox = document.getElementById('warnBox');
    const modelSourceSel = document.getElementById("modelSourceSel");
    const reloadModelBtn = document.getElementById("reloadModelBtn");

    //下拉切换源
    modelSourceSel.onchange = e=>{
        currentModelSource = e.target.value;
    };
    //点击重载按钮，清空旧模型缓存重新拉取
    reloadModelBtn.onclick = async ()=>{
        kokoroReady = false;
        ttsEngine = null;
        await loadOnlineModelAutoSwitch();
    };

    //手机端文本框强制初始化底色文字，杜绝空白不显示
    textBox.style.backgroundColor="#ffffff";
    textBox.style.color="#111111";

    if(!window.speechSynthesis){
        warnBox.style.display="block";
        playBtn.disabled=true;
        playBtn.innerText="浏览器不支持朗读";
    }

    dlModelBtn.onclick = ()=>{
        window.open(MODEL_REPO_URL,"_blank");
    };
    uploadBtn.onclick = ()=>{
        modelUploadInput.click();
    };
    modelUploadInput.onchange = async e=>{
        const f = e.target.files[0];
        if(!f)return;
        await loadLocalModel(f);
    };

    let bookText = "";
    let playPos = 0;
    let viewPos = 0;
    let currentFileName = "";
    const chunkSize = 800;
    const pageSize = 800;
    let speechRate = 1.0;
    let isPlaying = false;

    function renderView(){
        const slice = bookText.slice(viewPos, viewPos + pageSize);
        textBox.innerText = slice;
        const pct = bookText.length>0 ? Math.floor(playPos / bookText.length * 100) : 0;
        progressBar.value = pct;
        if(currentFileName && bookText.length>0){
            localStorage.setItem("book_pos_"+currentFileName, String(playPos));
        }
    }

    fileInput.onchange = async e=>{
        const f = e.target.files[0];
        if(!f) return;
        setStatus("读取TXT文件...");
        currentFileName = f.name;
        const buf = await f.arrayBuffer();
        const contentUtf8 = new TextDecoder("utf-8").decode(buf);
        const contentGb18030 = new TextDecoder("gb18030").decode(buf);
        const badUtf8 = (contentUtf8.match(/�/g) || []).length;
        const badGb18030 = (contentGb18030.match(/�/g) || []).length;
        if(badUtf8 <= badGb18030){
            bookText = contentUtf8;
            setStatus(`编码：UTF‑8，乱码符号：${badUtf8}`);
        }else{
            bookText = contentGb18030;
            setStatus(`编码：GB18030(Z‑Library)，乱码符号：${badGb18030}`);
        }
        const saved = localStorage.getItem("book_pos_"+currentFileName);
        if(saved !== null){
            const savedPos = parseInt(saved,10);
            if(!isNaN(savedPos) && savedPos < bookText.length){
                playPos = savedPos;
                viewPos = savedPos;
                setStatus(statusDom.innerText + "｜恢复上次播放位置");
            }else{
                playPos = 0; viewPos = 0;
            }
        }else{
            playPos = 0; viewPos = 0;
        }
        renderView();
    }

    function stopRead(){
        isPlaying = false;
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        setStatus("已暂停");
    }

    function getSentence(){
        if(playPos >= bookText.length) return null;
        const endLimit = Math.min(playPos + MAX_SENT_LEN, bookText.length);
        const segStr = bookText.slice(playPos, endLimit);
        let cutIndex = -1;
        for(let i=segStr.length-1;i>=0;i--){
            if(/[。！？；]/.test(segStr[i])){
                cutIndex = i+1;
                break;
            }
        }
        if(cutIndex <= 0) cutIndex = segStr.length;
        const textOut = segStr.slice(0,cutIndex).replace(/\s+$/,"");
        return {text:textOut,end:playPos+cutIndex};
    }

    async function speakNextChunk(){
        if(!isPlaying) return;
        if(kokoroReady && ttsEngine && audioCtx){
            const segInfo = getSentence();
            if(!segInfo || !segInfo.text){
                stopRead();
                setStatus("全书朗读结束");
                return;
            }
            setStatus("Kokoro离线女声朗读中");
            const res = await ttsEngine(segInfo.text,{rate:speechRate});
            const audioBuf = audioCtx.createBuffer(1,res.audio.length,res.sampling_rate);
            audioBuf.copyToChannel(res.audio,0);
            const src = audioCtx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(audioCtx.destination);
            src.start();
            await new Promise(r=>src.onended=r);
            playPos = segInfo.end;
        }else{
            let chunkText = bookText.slice(playPos, playPos + chunkSize);
            if(!chunkText){
                stopRead();
                setStatus("全书朗读结束");
                return;
            }
            chunkText = chunkText.replace(/\s+$/,'');
            const endPos = playPos + chunkSize;
            setStatus("正在朗读（系统语音，模型加载中）");
            const utter = new SpeechSynthesisUtterance(chunkText);
            utter.rate = speechRate;
            utter.onend = function(){
                playPos = endPos;
                renderView();
                setTimeout(()=>{
                    if(isPlaying){
                        window.speechSynthesis.cancel();
                        speakNextChunk();
                    }
                },15);
            };
            utter.onerror = function(){
                playPos = endPos;
                renderView();
                setTimeout(()=>{if(isPlaying) speakNextChunk();},30);
            };
            window.speechSynthesis.speak(utter);
            return;
        }
        renderView();
        if(isPlaying){
            setTimeout(speakNextChunk,20);
        }
    }

    playBtn.onclick = ()=>{
        if(!bookText){
            setStatus("请先选择TXT文件");
            return;
        }
        if(!window.speechSynthesis){
            setStatus("❌浏览器不支持TTS，请使用Edge");
            return;
        }
        if(isPlaying){
            stopRead();
        }else{
            isPlaying = true;
            speakNextChunk();
        }
    }
    prevBtn.onclick = ()=>{
        viewPos = Math.max(0, viewPos - pageSize);
        renderView();
    }
    nextBtn.onclick = ()=>{
        viewPos += pageSize;
        renderView();
    }
    speedSlider.oninput = ()=>{
        speechRate = Number(speedSlider.value);
        if(isPlaying){
            stopRead();
            isPlaying=true;
            speakNextChunk();
        }
    }
    resetSpeed.onclick = ()=>{
        speechRate = 1.0;
        speedSlider.value = 1.0;
        if(isPlaying){
            stopRead();
            isPlaying=true;
            speakNextChunk();
        }
        setStatus("语速已重置1.0倍");
    }
    progressBar.oninput = ()=>{
        stopRead();
        const val = Number(progressBar.value);
        const targetPos = Math.floor(val / 100 * bookText.length);
        playPos = targetPos;
        viewPos = targetPos;
        renderView();
    }
})
</script>
</body>
</html>
